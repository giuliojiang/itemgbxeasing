<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>GBX Moving Item Editor – Dors</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
  :root{--bg:#0f1115;--card:#171a21;--mut:#8a92a3;--acc:#7ee787;--acc2:#7ab2ff}
  body{margin:0;font-family:ui-sans,system-ui,sans-serif;background:var(--bg);color:#e6edf3}
  header{padding:18px 22px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
  h1{margin:0;font-size:18px;letter-spacing:.2px}
  h1 span{color:var(--acc);font-weight:700}
  .wrap{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 57px)}
  .side{border-right:1px solid #222;padding:16px;overflow:auto}
  .main{padding:16px;display:flex;flex-direction:column;gap:16px;overflow:auto}
  .card{background:var(--card);border:1px solid #232a35;border-radius:12px;padding:14px}
  .drop{border:2px dashed #2a3446;border-radius:12px;padding:18px;text-align:center;color:var(--mut);cursor:pointer}
  .drop.drag{background:#1b2332;border-color:var(--acc2)}
  label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px}
  input,select,button{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #2a3446;background:#0f131a;color:#e6edf3;font-size:13px}
  button{cursor:pointer;background:#1e2b3e;border-color:#2e425f}
  button.primary{background:var(--acc2);color:#081120;border-color:#5d9cff;font-weight:600}
  button:disabled{opacity:.5;cursor:not-allowed}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;background:#0b0e13;padding:8px;border-radius:8px;border:1px solid #1f2837;max-height:200px;overflow:auto}
  canvas{width:100%;height:160px;background:#0b0e13;border:1px solid #232a35;border-radius:10px}
  .track{border-left:3px solid var(--acc2);padding:8px 10px;margin:8px 0;background:#121720;border-radius:0 8px 8px 0}
  .track.rot{border-color:var(--acc)}
  .pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:#1d2a3d;color:#9ab5d6;margin-right:6px}
  .status{font-size:12px;color:var(--mut);padding:6px 0}
  .progress{height:4px;background:#1d2636;border-radius:999px;overflow:hidden;margin:6px 0}
  .progress i{display:block;height:100%;width:0;background:var(--acc2);transition:width .2s}
</style>
</head>
<body>
<header>
  <h1><span>GBX</span> Moving Item Editor</h1>
  <div style="font-size:12px;color:var(--mut)">No-worker fast path – chunked, keeps UI alive</div>
</header>
<div class="wrap">
  <div class="side">
    <div class="card">
      <div id="drop" class="drop">Drop .Item.Gbx here or click<br><span style="font-size:11px">zzz_RotBalloons / MovingDuck / Santa</span></div>
      <input id="file" type="file" accept=".gbx,.Gbx" style="display:none"/>
      <div class="progress"><i id="prog"></i></div>
      <div id="status" class="status">Idle – ready for GitHub Pages</div>
      <div id="info" class="mono" style="margin-top:8px">No file loaded.</div>
      <label>Detected mover candidates</label>
      <select id="cands"></select>
      <div id="moverCard" style="display:none;margin-top:10px">
        <div style="font-size:12px;color:var(--mut)">Mover @ <span id="moff"></span></div>
        <label>Version</label><input id="mv_ver" type="number" min="0" max="6" step="1"/>
        <div class="grid2">
          <div><label>RotPeriod</label><input id="mv_rotP" type="number" step="1"/></div>
          <div><label>TransPeriod</label><input id="mv_transP" type="number" step="1"/></div>
        </div>
        <label>TransY</label><input id="mv_transY" type="number" step="0.01"/>
        <div class="grid2">
          <div><label>Axis</label><input id="mv_axis" type="number" min="0" max="2" step="1"/></div>
          <div><label>RotAngle rad</label><input id="mv_rotAng" type="number" step="0.01"/></div>
        </div>
        <div class="grid2">
          <div><label>RotPeriodMax</label><input id="mv_rotMax" type="number" step="1"/></div>
          <div><label>TransPeriodMax</label><input id="mv_transMax" type="number" step="1"/></div>
        </div>
        <label>RotFunc</label><input id="mv_rotFunc" type="number" min="0" max="10" step="1"/>
        <button id="applyMover" class="primary" style="margin-top:10px">Apply to buffer</button>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <div style="font-weight:600;font-size:13px;margin-bottom:8px">Web-like Chains</div>
      <div id="tracks"></div>
      <div class="grid2" style="margin-top:8px"><button id="addT">+ Translate</button><button id="addR">+ Rotate</button></div>
      <label>Compose</label><select id="compose"><option value="parallel">Parallel – combine</option><option value="sequence">Sequence – chain</option></select>
      <canvas id="preview" width="640" height="200"></canvas>
      <button id="bake" style="margin-top:8px">Bake → mover</button>
      <div id="bakeLog" class="mono" style="margin-top:8px"></div>
    </div>
    <div class="card" style="margin-top:12px">
      <button id="export" class="primary" disabled>Export .Item.Gbx (BUUR uncompressed)</button>
      <button id="exportBin" style="margin-top:8px" disabled>Export .bin</button>
    </div>
  </div>
  <div class="main">
    <div class="card">
      <div style="font-weight:600">Timeline</div>
      <div id="vis" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px">
        <div><div style="font-size:12px;color:var(--mut)">TranslateY</div><canvas id="cvT" width="500" height="160"></canvas></div>
        <div><div style="font-size:12px;color:var(--mut)">Rotate</div><canvas id="cvR" width="500" height="160"></canvas></div>
      </div>
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:6px">Body preview (virtual hex – fast)</div>
      <div id="hex" class="mono" style="max-height:420px"></div>
    </div>
  </div>
</div>
<script type="module">
import { decompress } from './lzo.js';
const $=id=>document.getElementById(id);
const prog=$('prog'), statusEl=$('status');
function setStatus(s){ statusEl.textContent=s; }
function setProg(p){ prog.style.width=(p*100).toFixed(1)+'%'; }

// LZO is synchronous but fast (~10-40ms for 900KB). We yield to UI with scheduler.
async function decompressYielding(comp, outLen){
  setStatus('Decompressing '+comp.length+' → '+outLen+' ...');
  setProg(0.3);
  // break into microtask to paint progress
  await new Promise(r=>setTimeout(r, 16));
  const t0=performance.now();
  let out;
  try{
    out = decompress(comp, outLen);
  }catch(e){
    console.error(e);
    throw e;
  }
  const ms=(performance.now()-t0)|0;
  setStatus('Decompressed in '+ms+'ms');
  setProg(0.7);
  await new Promise(r=>setTimeout(r, 10));
  return out;
}

function readU32(b,o){return (b[o]|b[o+1]<<8|b[o+2]<<16|b[o+3]<<24)>>>0;}
function parseGBX(u8){
  if(String.fromCharCode(...u8.slice(0,3))!=='GBX') throw new Error('Not GBX');
  const fmt=String.fromCharCode(...u8.slice(5,9));
  const classId=readU32(u8,9);
  const userSize=readU32(u8,13);
  const hdrEnd=17+userSize;
  const numNodes=readU32(u8,hdrEnd);
  const numExt=readU32(u8,hdrEnd+4);
  const bPtr=hdrEnd+8;
  const uncomp=readU32(u8,bPtr);
  const comp=readU32(u8,bPtr+4);
  const cStart=bPtr+8, cEnd=cStart+comp;
  return {fmt,classId,hdrEnd,numNodes,numExt,bPtr,uncomp,comp,cStart,cEnd};
}

let origFileBytes=null, decomp=null, bodyPtr=0, moverCandidates=[], selectedIdx=-1;

const drop=$('drop'), fileInput=$('file');
drop.addEventListener('click',()=>fileInput.click());
drop.addEventListener('dragover',e=>{e.preventDefault(); drop.classList.add('drag');});
drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));
drop.addEventListener('drop',e=>{e.preventDefault(); drop.classList.remove('drag'); const f=e.dataTransfer.files[0]; if(f) handleFile(f);});
fileInput.addEventListener('change',e=>{ const f=e.target.files[0]; if(f) handleFile(f);});

async function handleFile(f){
  setStatus('Reading '+f.name+' ...');
  setProg(0.1);
  const ab=await f.arrayBuffer();
  origFileBytes=new Uint8Array(ab);
  try{
    const p=parseGBX(origFileBytes);
    bodyPtr=p.bPtr;
    setStatus(`Header OK fmt ${p.fmt} nodes ${p.numNodes} uncomp ${p.uncomp} – decompressing...`);
    const compBytes=origFileBytes.slice(p.cStart,p.cEnd);
    const out = await decompressYielding(compBytes, p.uncomp);
    decomp=out;
    setStatus(`Decomp OK ${out.length} – scanning (chunked)...`);
    setProg(0.8);
    const cand = await scanMoversChunked(out, 50);
    moverCandidates=cand;
    const sel=$('cands'); sel.innerHTML='';
    cand.forEach((c,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=`#${i} @${c.off} rotP${c.rotP} transP${c.transP} a${c.axis}`; sel.appendChild(o); });
    if(cand.length) selectCand(0);
    renderHexFast();
    $('export').disabled=false; $('exportBin').disabled=false;
    $('info').textContent=`File ${f.name} ${ab.byteLength} → decomp ${out.length}\nCandidates ${cand.length}`;
    buildTracksUI();
  }catch(e){ setStatus('Error: '+e.message); console.error(e); }
  setProg(1); setTimeout(()=>setProg(0),600);
}

// chunked scanner – yields every 16k steps so UI never freezes for minutes
async function scanMoversChunked(buf, maxCand){
  const dv=new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  const cand=[];
  let off=0;
  const CHUNK=16384;
  while(off<buf.length-32 && cand.length<maxCand){
    const end=Math.min(off+CHUNK, buf.length-32);
    for(; off<end; off++){
      const ver=dv.getInt32(off,true);
      if(ver<0||ver>3) continue;
      const rotP=dv.getInt32(off+4,true), transP=dv.getInt32(off+8,true);
      if(rotP<0||rotP>500000||transP<0||transP>500000) continue;
      const transY=dv.getFloat32(off+12,true); if(Math.abs(transY)>500) continue;
      const axis=dv.getInt32(off+16,true); if(axis<0||axis>5) continue;
      const rotMax=dv.getInt32(off+20,true), transMax=dv.getInt32(off+24,true);
      if(rotMax<0||rotMax>500000||transMax<0||transMax>500000) continue;
      const rotFunc=buf[off+28]; if(rotFunc>10) continue;
      if(rotP===0&&transP===0) continue;
      const rotAng=dv.getFloat32(off+29,true); if(Math.abs(rotAng)>1000) continue;
      cand.push({off,ver,rotP,transP,transY,axis,rotMax,transMax,rotFunc,rotAng});
      if(cand.length>=maxCand) break;
    }
    if(off % (CHUNK*4) === 0){
      setStatus(`Scanning @${off}/${buf.length} – ${cand.length} found…`);
      await new Promise(r=>setTimeout(r,0)); // yield
    }
  }
  setStatus(`Scan done – ${cand.length} candidates`);
  return cand;
}

function selectCand(i){
  selectedIdx=i; const c=moverCandidates[i]; if(!c) return;
  $('moverCard').style.display='block';
  $('moff').textContent=c.off;
  $('mv_ver').value=c.ver; $('mv_rotP').value=c.rotP; $('mv_transP').value=c.transP;
  $('mv_transY').value=c.transY; $('mv_axis').value=c.axis; $('mv_rotMax').value=c.rotMax;
  $('mv_transMax').value=c.transMax; $('mv_rotFunc').value=c.rotFunc; $('mv_rotAng').value=c.rotAng;
}
$('cands').addEventListener('change',e=>selectCand(parseInt(e.target.value)));

$('applyMover').addEventListener('click',()=>{
  if(selectedIdx<0||!decomp) return;
  const c=moverCandidates[selectedIdx];
  const dv=new DataView(decomp.buffer);
  dv.setInt32(c.off, parseInt($('mv_ver').value)||0,true);
  dv.setInt32(c.off+4, parseInt($('mv_rotP').value)||0,true);
  dv.setInt32(c.off+8, parseInt($('mv_transP').value)||0,true);
  dv.setFloat32(c.off+12, parseFloat($('mv_transY').value)||0,true);
  dv.setInt32(c.off+16, parseInt($('mv_axis').value)||0,true);
  dv.setInt32(c.off+20, parseInt($('mv_rotMax').value)||0,true);
  dv.setInt32(c.off+24, parseInt($('mv_transMax').value)||0,true);
  decomp[c.off+28]=parseInt($('mv_rotFunc').value)||0;
  dv.setFloat32(c.off+29, parseFloat($('mv_rotAng').value)||0,true);
  renderHexFast(c.off);
  setStatus('Patched @'+c.off);
});

// Virtual hex – only renders visible window, not whole file
function renderHexFast(h=-1){
  if(!decomp) return;
  const start=h>=0?Math.max(0,h-128):0;
  const len=Math.min(1024, decomp.length-start);
  let lines=[];
  for(let i=0;i<len;i+=16){
    const off=start+i;
    let hex=''; let asc='';
    for(let j=0;j<16 && off+j<decomp.length;j++){ const b=decomp[off+j]; hex+=b.toString(16).padStart(2,'0')+' '; asc+=(b>=32&&b<127)?String.fromCharCode(b):'.'; }
    const mark=h>=0 && off<=h && h<off+16 ? '>>' : '  ';
    lines.push(`${mark} ${String(off).padStart(7)}  ${hex.padEnd(48)} ${asc}`);
  }
  $('hex').textContent=lines.join('\n')+`\n… total ${decomp.length} bytes`;
}

// tracks - lightweight duplicate
let tracks=[];
function buildTracksUI(){
  const cont=$('tracks'); cont.innerHTML='';
  tracks.forEach((tr,i)=>{
    const d=document.createElement('div'); d.className='track'+(tr.type==='r'?' rot':'');
    d.innerHTML=`<div style="display:flex;justify-content:space-between"><b>${tr.type==='t'?'T':'R'} #${i}</b><button data-i="${i}" class="del" style="width:auto">✕</button></div>
    <div class="grid2"><div><label>from</label><input data-k="from" data-i="${i}" value="${tr.from}"></div><div><label>to</label><input data-k="to" data-i="${i}" value="${tr.to}"></div></div>
    <div class="grid2"><div><label>dur</label><input data-k="dur" data-i="${i}" type="number" value="${tr.dur}"></div><div><label>delay</label><input data-k="delay" data-i="${i}" type="number" value="${tr.delay}"></div></div>
    <select data-k="easing" data-i="${i}"><option>linear</option><option ${tr.easing==='easeInOut'?'selected':''}>easeInOut</option><option ${tr.easing==='spring'?'selected':''}>spring</option></select>
    ${tr.type==='r'?`<input data-k="axis" data-i="${i}" value="${tr.axis}" placeholder="axis">`:''}`;
    cont.appendChild(d);
  });
  cont.querySelectorAll('input,select').forEach(el=>el.addEventListener('change',e=>{ const i=+e.target.dataset.i, k=e.target.dataset.k; let v=e.target.value; if(['dur','delay','from','to','axis'].includes(k)) tracks[i][k]=parseFloat(v)||0; else tracks[i][k]=v; draw(); }));
  cont.querySelectorAll('.del').forEach(b=>b.addEventListener('click',e=>{ tracks.splice(+e.target.dataset.i,1); buildTracksUI(); draw(); }));
  draw();
}
$('addT').addEventListener('click',()=>{ tracks.push({type:'t',from:0,to:2,dur:2000,delay:0,easing:'easeInOut'}); buildTracksUI(); });
$('addR').addEventListener('click',()=>{ tracks.push({type:'r',from:0,to:6.28,dur:4000,delay:0,easing:'linear',axis:1}); buildTracksUI(); });
function interp(t,e){ if(e==='linear') return t; if(e==='easeInOut') return 0.5*(1-Math.cos(Math.PI*t)); return 1-Math.cos(t*6.28*1.5)*Math.exp(-3*t); }
function sample(tr,tm){ const st=tr.delay; const lt=tr.dur?((tm-st)%tr.dur+tr.dur)%tr.dur:0; if(tm<st) return tr.from; return tr.from+(tr.to-tr.from)*interp(lt/tr.dur,tr.easing); }
function draw(){
  const cv=$('preview'), ctx=cv.getContext('2d'); ctx.clearRect(0,0,cv.width,cv.height);
  tracks.filter(t=>t.type==='t').forEach(tr=>{ ctx.beginPath(); ctx.strokeStyle='#7ab2ff'; for(let x=0;x<cv.width;x++){ const v=sample(tr,x/cv.width*4000); const y=cv.height/2 - v*20; if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);} ctx.stroke(); });
  tracks.filter(t=>t.type==='r').forEach(tr=>{ ctx.beginPath(); ctx.strokeStyle='#7ee787'; for(let x=0;x<cv.width;x++){ const v=sample(tr,x/cv.width*4000); const y=cv.height/2+Math.sin(v)*30; if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);} ctx.stroke(); });
}
$('bake').addEventListener('click',()=>{
  const t=tracks.filter(x=>x.type==='t'), r=tracks.filter(x=>x.type==='r');
  const transP=Math.max(0,...t.map(x=>x.dur),0), rotP=Math.max(0,...r.map(x=>x.dur),0);
  const transY=t.length? Math.max(...t.map(x=>Math.abs(x.to-x.from))):0;
  const rotA=r.length? r[0].to-r[0].from:0;
  const axis=r.length? r[0].axis:1;
  if(selectedIdx>=0){ $('mv_transP').value=Math.round(transP); $('mv_rotP').value=Math.round(rotP); $('mv_transY').value=transY.toFixed(2); $('mv_rotAng').value=rotA.toFixed(2); $('mv_axis').value=axis; $('bakeLog').textContent='baked'; }
});
$('exportBin').addEventListener('click',()=>{ if(!decomp) return; const b=new Blob([decomp]); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='body.bin'; a.click(); });
$('export').addEventListener('click',()=>{
  if(!origFileBytes||!decomp) return;
  const hdr=origFileBytes.slice(0,bodyPtr); const out=new Uint8Array(hdr.length+decomp.length); out.set(hdr,0); out.set(decomp,hdr.length); out[7]=0x55;
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([out])); a.download='edited_Item.Gbx'; a.click();
});
$('compose').addEventListener('change',draw);
draw();
</script>
</body>
</html>
